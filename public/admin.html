<!DOCTYPE html>
<html>
<head>
  <title>ISC SANEP - Admin</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px; }
    .box { background:#fff; padding:20px; margin-bottom:20px; border-radius:10px; }
    input, button { padding:10px; margin:5px; }
    button { cursor:pointer; }
  </style>
</head>

<body>

<h1>ISC SANEP - PAINEL ADMIN</h1>

<div class="box">
  <h2>📱 Registrar Dispositivo (IMEI)</h2>
  <input id="deviceId" placeholder="Device ID / IMEI">
  <input id="user" placeholder="Usuário">
  <button onclick="addDevice()">Salvar</button>
</div>

<div class="box">
  <h2>👤 Criar Usuário</h2>
  <input id="nome" placeholder="Nome">
  <input id="login" placeholder="Login">
  <button onclick="addUser()">Salvar</button>
</div>

<script>

const API = "/admin";

// ================= ADD DEVICE =================
function addDevice() {
  fetch(API + "/devices", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      deviceId: document.getElementById("deviceId").value,
      user: document.getElementById("user").value,
      active: true,
      rotas: []
    })
  }).then(() => alert("Dispositivo salvo"));
}

// ================= ADD USER =================
function addUser() {
  fetch(API + "/users", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      id: Date.now(),
      nome: document.getElementById("nome").value,
      login: document.getElementById("login").value,
      senha: "1234",
      nivel: "operador",
      ativo: true
    })
  }).then(() => alert("Usuário criado"));
}

</script>

</body>
</html>
