<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    ISC SANEP ADMIN
  </title>

  <style>

    body {

      font-family: Arial;

      background: #f5f5f5;

      padding: 20px;

    }

    .card {

      background: white;

      padding: 20px;

      margin-bottom: 20px;

      border-radius: 10px;

      box-shadow:
        0 2px 5px rgba(0,0,0,0.1);

    }

    h1 {

      color: #1565c0;

    }

    .numero {

      font-size: 28px;

      font-weight: bold;

    }

    table {

      width: 100%;

      border-collapse: collapse;

    }

    table th,
    table td {

      border: 1px solid #ddd;

      padding: 10px;

    }

    table th {

      background: #1565c0;

      color: white;

    }

  </style>

</head>

<body>

  <h1>
    ISC SANEP ADMIN
  </h1>

  <div class="card">

    <h2>
      Dashboard
    </h2>

    <p>
      Imóveis:
      <span
        class="numero"
        id="imoveis"
      >
        0
      </span>
    </p>

    <p>
      Leituras:
      <span
        class="numero"
        id="leituras"
      >
        0
      </span>
    </p>

    <p>
      Usuários:
      <span
        class="numero"
        id="usuarios"
      >
        0
      </span>
    </p>

    <p>
      Produtividade:
      <span
        class="numero"
        id="produtividade"
      >
        0%
      </span>
    </p>

  </div>

  <div class="card">

    <h2>
      Usuários
    </h2>

    <table>

      <thead>

        <tr>

          <th>ID</th>
          <th>Nome</th>
          <th>Login</th>
          <th>Nível</th>

        </tr>

      </thead>

      <tbody id="usuariosTabela">

      </tbody>

    </table>

  </div>

  <script>

    async function carregarDashboard() {

      const res =
        await fetch(
          "/dashboard"
        );

      const data =
        await res.json();

      document.getElementById(
        "imoveis"
      ).innerText =
        data.dashboard.total_imoveis;

      document.getElementById(
        "leituras"
      ).innerText =
        data.dashboard.total_leituras;

      document.getElementById(
        "usuarios"
      ).innerText =
        data.dashboard.total_usuarios;

      document.getElementById(
        "produtividade"
      ).innerText =
        data.dashboard.produtividade + "%";

    }

    async function carregarUsuarios() {

      const res =
        await fetch(
          "/auth/usuarios"
        );

      const usuarios =
        await res.json();

      let html = "";

      usuarios.forEach(u => {

        html += `

          <tr>

            <td>${u.id}</td>
            <td>${u.nome}</td>
            <td>${u.login}</td>
            <td>${u.nivel}</td>

          </tr>

        `;

      });

      document.getElementById(
        "usuariosTabela"
      ).innerHTML =
        html;

    }

    carregarDashboard();

    carregarUsuarios();

  </script>

</body>
</html>
